concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  darwin:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: cachix/install-nix-action@v31
    - name: Build Darwin checks
      run: nix flake check --no-update-lock-file --print-build-logs
    timeout-minutes: 120
  linux:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: cachix/install-nix-action@v31
    - name: Evaluate
      run: |-
        nix eval --no-update-lock-file --option allow-import-from-derivation false --raw .#checks.aarch64-linux.installer-e2e.drvPath
        nix flake check --no-build --no-update-lock-file .
    - name: Build non-VM checks
      run: nix build --no-update-lock-file --print-build-logs .#checks.aarch64-linux.non-vm
    timeout-minutes: 120
name: Full build
'on':
  schedule:
  - cron: 0 18 * * *
  workflow_dispatch: {}
permissions:
  contents: read
